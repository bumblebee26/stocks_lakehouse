name: Terraform init
description: Install Terraform and initialise one stack against the S3 state backend.

inputs:
  stack:
    description: Folder under infra/ (aws or databricks)
    required: true
  state-bucket:
    description: S3 bucket holding Terraform state
    required: true
  region:
    description: AWS region of the state bucket
    required: true
  terraform-version:
    description: Terraform CLI version
    required: false
    default: "1.x"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: terraform init (${{ inputs.stack }})
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      env:
        STACK: ${{ inputs.stack }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
        STATE_REGION: ${{ inputs.region }}
      run: |
        terraform init -input=false \
          -backend-config="bucket=${STATE_BUCKET}" \
          -backend-config="key=${STACK}/terraform.tfstate" \
          -backend-config="region=${STATE_REGION}" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"
