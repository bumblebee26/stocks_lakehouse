name: Security

# Automated security checks, no secrets used. Runs on every pull request, on main, and weekly
# (new vulnerabilities are published for code that hasn't changed).
#   CodeQL    Python and the workflow files: injection, unsafe deserialisation, leaked secrets in logs, ...
#   zizmor    GitHub Actions attacks: script injection from inputs, over-broad tokens, risky triggers
#   Checkov   Terraform: risky AWS / Databricks settings (public buckets, wide IAM, missing encryption)
# Findings appear under the repository's Security tab -> Code scanning and in each job's log. CodeQL
# and zizmor fail the check on high severity; Checkov reports only (reviewed exceptions in .checkov.yaml).
# Actions are pinned to commit hashes (a moved tag can't swap in other code); Dependabot updates them.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * 0" # Monday 03:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: List findings (fails on high severity)
        run: python3 .github/scripts/sarif_summary.py codeql-results

  workflows:
    name: Workflow attacks (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -q "zizmor>=1,<2"
      - name: Report all findings
        run: zizmor --format sarif . > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Fail on high-severity findings
        run: zizmor --min-severity high .

  terraform:
    name: Terraform settings (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -q checkov
      - name: Scan infra/
        run: checkov --config-file .checkov.yaml -d infra --output cli --output sarif --output-file-path console,checkov.sarif --soft-fail
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

