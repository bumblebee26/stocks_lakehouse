name: Security

# Automated security checks, no secrets used. Runs on every pull request, on main, and weekly
# (new vulnerabilities are published for code that hasn't changed).
#   CodeQL    Python and the workflow files: injection, unsafe deserialisation, leaked secrets in logs, ...
#   zizmor    GitHub Actions attacks: script injection from inputs, over-broad tokens, risky triggers
#   Checkov   Terraform: risky AWS / Databricks settings (public buckets, wide IAM, missing encryption)
# Findings appear under the repository's Security tab -> Code scanning. CodeQL and zizmor (high
# severity) fail the check; Checkov reports only, see .checkov.yaml for the reviewed skips.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * 0" # Monday 03:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  workflows:
    name: Workflow attacks (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -q "zizmor>=1,<2"
      - name: Report all findings
        run: zizmor --format sarif . > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Fail on high-severity findings
        run: zizmor --min-severity high .

  terraform:
    name: Terraform settings (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -q checkov
      - name: Scan infra/
        run: checkov --config-file .checkov.yaml -d infra --output cli --output sarif --output-file-path console,checkov.sarif --soft-fail
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

