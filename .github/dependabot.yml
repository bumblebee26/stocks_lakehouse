# Weekly update PRs for GitHub Actions, grouped to keep the noise low.
# Minor and patch updates only: major versions can change behaviour, so they are upgraded by hand.
# Security fixes still arrive through Dependabot security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
