<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#020617">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>
  // Theme before first paint (no flash): the saved choice, else the phone's setting.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading Desk">
<title>Trading Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* NSE Paper Trading Desk, mobile. Layout A+B: tab bar app, the Desk tab opens with the day's story.
   Data: data/desk.json, written by the app-export Lambda after each Databricks job. Dummy money only. */
:root {   /* light (ui-ux-pro-max "Financial Dashboard" palette, light variant; text contrast >= 4.5:1) */
  --bg: #f1f5f9; --card: #ffffff; --fg: #0f172a; --muted: #475569; --line: #e2e8f0; --soft: #f1f5f9;
  --accent: #2563eb; --up: #15803d; --down: #b91c1c; --nb: #64748b; --chip: #dcfce7; --chip-fg: #166534;
  --heat-up: 22, 163, 74; --heat-down: 220, 38, 38; --shadow: 0 1px 2px rgba(15, 23, 42, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #020617; --card: #0e1223; --fg: #f8fafc; --muted: #94a3b8; --line: #1e293b; --soft: #1a1e2f;
  --accent: #60a5fa; --up: #22c55e; --down: #f87171; --nb: #94a3b8; --chip: #052e16; --chip-fg: #4ade80;
  --heat-up: 34, 197, 94; --heat-down: 248, 113, 113; --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #020617; --card: #0e1223; --fg: #f8fafc; --muted: #94a3b8; --line: #1e293b; --soft: #1a1e2f;
  --accent: #60a5fa; --up: #22c55e; --down: #f87171; --nb: #94a3b8; --chip: #052e16; --chip-fg: #4ade80;
  --heat-up: 34, 197, 94; --heat-down: 248, 113, 113; --shadow: none; color-scheme: dark;
}
@media (prefers-reduced-motion: no-preference) { button, .card, .tile { transition: background-color .2s, color .2s, border-color .2s } }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-feature-settings: "tnum" 1, "cv11" 1; -webkit-text-size-adjust: 100% }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 10px }
header .chips { grid-column: 1 / -1; justify-content: flex-start }
header .chips:empty { display: none }
header .t { display: flex; flex-direction: column }
header .t b { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }
header .t span { font-size: 13px; color: var(--muted) }
.hr { display: flex; align-items: center; gap: 8px }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end }
.theme { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); cursor: pointer; padding: 0 }
.theme svg { width: 20px; height: 20px }
.ic { width: 14px; height: 14px; vertical-align: -2px; flex: none }
.chip { font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap }
.chip.on { background: var(--chip); color: var(--chip-fg) }
main { padding: 0 14px calc(env(safe-area-inset-bottom) + 86px); display: flex; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto }
h2 { font-size: 22px; margin: 4px 2px 0 }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow) }
.card h3 { font-size: 15px; font-weight: 600; margin: 0 0 10px }
.story h1 { font-size: 22px; line-height: 1.2; margin: 2px 0 8px }
.story p { margin: 6px 0; color: var(--fg) }
.story .when { font-size: 12px; color: var(--muted) }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.tile .l { font-size: 12px; color: var(--muted) }
.tile .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.up { color: var(--up) } .down { color: var(--down) } .muted { color: var(--muted) }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 46px; border-top: 1px solid var(--soft); padding: 6px 0 }
.row:first-of-type { border-top: 0 }
.row .n { display: flex; flex-direction: column; min-width: 0 }
.row .n b { font-size: 14px; font-weight: 600 }
.row .n span { font-size: 12px; color: var(--muted) }
.row .r { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--soft); border-radius: 10px; padding: 3px }
.seg button { min-height: 44px; cursor: pointer; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 600 13px inherit; font-family: inherit }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg) }
svg.chart { width: 100%; height: 140px; display: block; touch-action: pan-y }
.cwrap { position: relative }
.tip { position: absolute; top: -6px; transform: translateY(-100%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; font-size: 12px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.15); pointer-events: none; max-width: 92%; z-index: 1 }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }
.lgd { margin-top: 6px }
.lgd summary { min-height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; list-style: none }
.lgd summary::before { content: "▸"; margin-right: 6px }
.lgd[open] summary::before { content: "▾" }
.lg { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 44px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); color: var(--fg); font: 500 12px/1.2 inherit; font-family: inherit; cursor: pointer }
.lg i { flex: none; width: 14px; height: 3px; border-radius: 2px }
.lg i.dash { background-image: linear-gradient(90deg, currentColor 55%, transparent 0) !important; background-size: 5px 3px }
.lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lg.real { font-weight: 700; border-color: var(--fg) }
.lg[aria-pressed="true"] { background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
svg.chart.hl polyline { opacity: .15 }
.rng { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; margin: 2px 0 6px }
.rng button { min-height: 44px; cursor: pointer; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 600 12px inherit; font-family: inherit }
.rng button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
.rng button:disabled { opacity: .35 }
.holiday { position: relative; padding-right: 48px }
.holiday h3 { font-size: 19px; margin: 0 0 6px }
.holiday p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45 }
.holiday .x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 26px; line-height: 1; cursor: pointer }
.chg { font-size: 13px; margin: 0 2px 4px; color: var(--muted) }
.chg b { color: var(--fg) }
svg.chart.hl polyline.on { opacity: 1; stroke-width: 3.5 }
.sug .row .r { font-weight: 600; font-size: 13px }
.sug a { color: var(--accent); text-decoration: none; font-weight: 600 }
.sub { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px }
.sub:first-of-type { margin-top: 0 }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.tiles.three .tile { padding: 10px }
.tiles.three .v { font-size: 19px }
.note { font-size: 12px; color: var(--muted); margin: 6px 2px 0 }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
.tiles.four .tile { padding: 8px }
.tiles.four .v { font-size: 15px; white-space: nowrap; overflow-wrap: normal }
.tile .s { font-size: 13px; font-weight: 600 }
.banner { background: var(--chip); border-color: transparent }
.banner.off { background: var(--soft) }
.banner h3 { margin-bottom: 4px }
.banner p { margin: 0; font-size: 13px; color: var(--fg) }
.tiles.bul .v { font-size: 17px; white-space: nowrap }
.row.sec .n { display: flex; flex-direction: row; align-items: center; gap: 12px }
.row.sec .n > span { display: flex; flex-direction: column }
.row.sec .n b { color: var(--fg); font-size: 15px }
.sec .r { font-weight: 700 }
.sic { width: 24px; height: 24px; flex: none; color: var(--muted) }
.heat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.heat button { min-height: 60px; min-width: 0; border: 1px solid transparent; border-radius: 10px; padding: 6px 7px; text-align: left; color: var(--fg); font: 500 11px/1.3 inherit; font-family: inherit; cursor: pointer; white-space: nowrap }
.heat button span { display: block; font-size: 12px; font-weight: 700 }
.heat button b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.heat button[aria-pressed="true"] { border-color: var(--fg) }
.heat button:disabled { cursor: default }
.row.pick { width: 100%; min-height: 52px; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: var(--fg); font: inherit; text-align: left; cursor: pointer }
.tests { padding: 2px 0 8px }
.row:has(.you) { display: grid; grid-template-columns: 1fr 60px 112px; align-items: center }
.you { text-align: center; font-size: 12px }
.you .ic { width: 18px; height: 18px }
.more { width: 100%; min-height: 44px; margin-top: 4px; border: 1px dashed var(--line); border-radius: 10px; background: none; color: var(--accent); font: 600 13px/1 inherit; font-family: inherit; cursor: pointer }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 6px }
.ch h3 { margin: 0 }
.vsw { flex: none; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--fg); font: 600 13px/1 inherit; font-family: inherit; cursor: pointer; white-space: nowrap }
.vsw span { border-bottom: 1px dashed var(--muted); padding-bottom: 2px }
.tgroup { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin: 10px 0; background: var(--soft) }
.tgroup.real { border-color: var(--up) }
.tgroup .row { border-top: 1px solid var(--line) }
.thead { display: flex; align-items: center; gap: 8px; padding: 8px 0; flex-wrap: wrap }
.thead b { flex: 1 1 auto; font-size: 14px }
.thead .muted { font-size: 12px }
.tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px }
.tag-real { background: var(--chip); color: var(--chip-fg) }
.tag-shadow { background: var(--line); color: var(--muted) }
.tests .tl { font-size: 13px; padding: 3px 0 }
.tests .tl > span { color: var(--fg) }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.mkt { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 6px }
.mkt button { padding: 0 2px }
.mkt button { font-size: 12px }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--line); padding: 4px 4px calc(env(safe-area-inset-bottom) + 6px) }
nav button { min-height: 52px; border: 0; background: none; cursor: pointer; color: var(--muted); font: 600 12px inherit; font-family: inherit; border-top: 3px solid transparent }
nav button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent) }
.err { border-color: var(--down) }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); margin: 2px 4px 2px 0 }
.ok { display: flex; gap: 6px; align-items: flex-start }
</style>
</head>
<body>
<header>
  <div class="t"><b>NSE Paper Trading Desk</b><span id="updated">Loading…</span></div>
  <button type="button" class="theme" id="theme" aria-label="Switch to light theme"></button>
  <div class="chips" id="chips"></div>
</header>
<main id="main" aria-live="polite"></main>
<nav aria-label="Sections">
  <button type="button" data-tab="desk" aria-current="page">Desk</button>
  <button type="button" data-tab="intraday">Intraday</button>
  <button type="button" data-tab="swing">Swing</button>
  <button type="button" data-tab="long">Long</button>
  <button type="button" data-tab="markets">Markets</button>
</nav>
<script>
"use strict";
let D = {};
// Small inline SVG icons (Lucide-style strokes); the meaning is always also in the text next to them.
const ICON = {
  star: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  cross: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  dash: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  thumbUp: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-label="liked"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 17.6 20H7"/></svg>',
  thumbDown: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-label="disliked"><path d="M17 13V4h3v9zM17 13l-4 8a2 2 0 0 1-2-2v-4H5a2 2 0 0 1-2-2.3l1.4-7A2 2 0 0 1 6.4 4H17"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>',
};
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
function paintThemeButton() {
  const b = document.getElementById("theme"), dark = isDark();
  b.innerHTML = dark ? ICON.sun : ICON.moon;
  b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#020617" : "#f1f5f9");
}
let tab = "desk";
let show = { swing: "both", long: "both", intraday: "both" };
try { tab = localStorage.getItem("tab") || "desk"; if (tab === "custom") tab = "desk"; } catch (e) {}

const rows = (n) => ((D.datasets || {})[n] || {}).rows || [];
const one = (n) => rows(n)[0] || {};
const esc = (s) => String(s == null ? "–" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v) => (v == null || v === "" || isNaN(Number(v)) ? null : Number(v));
const rs = (v, sign) => { const n = num(v); if (n == null) return "–"; const s = "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN"); return sign ? (n < 0 ? "−" : "+") + s : (n < 0 ? "−" : "") + s; };
const pct = (v, sign) => { const n = num(v); if (n == null) return "–"; return (sign && n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2) + "%"; };
const cls = (v) => { const n = num(v); return n == null ? "" : n > 0 ? "up" : n < 0 ? "down" : ""; };
const arrowCls = (s) => (String(s).startsWith("▲") ? "up" : String(s).startsWith("▼") ? "down" : "");

const CHARTS = [];
function lineChart(series, label, fmt) {
  // series: [{name, color, dash, points: [[x(date string), y]]}]. Touch or hover shows the date and every value.
  const all = series.flatMap((s) => s.points.map((p) => p[1]));
  if (all.length < 2) return '<p class="muted">Not enough days yet.</p>';
  const dates = [...new Set(series.flatMap((s) => s.points.map((p) => p[0])))].sort();
  const lo = Math.min(...all), hi = Math.max(...all), pad = (hi - lo) * 0.1 || 1;
  const L = 46, W = 340, H = 130, R = 4, pos = Object.fromEntries(dates.map((d, i) => [d, i]));
  const x = (d) => L + (pos[d] / Math.max(dates.length - 1, 1)) * (W - L - R);
  const y = (v) => H - 6 - ((v - lo + pad) / (hi - lo + 2 * pad)) * (H - 12);
  const f = (v) => (fmt ? fmt(v) : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-IN") : v.toFixed(2)));
  const grid = [lo, (lo + hi) / 2, hi].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--soft)"/>`
    + `<text x="${L - 4}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${esc(f(v))}</text>`).join("");
  const zero = lo < 0 && hi > 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line)"/>` : "";
  const lines = series.map((s, i) => `<polyline data-i="${i}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 2 : 2.5}" ${s.dash ? 'stroke-dasharray="5 4"' : ""} points="${s.points.map((p) => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ")}"/>`).join("");
  const id = CHARTS.length;
  const long = dates.length > 1 && dates.at(-1).slice(0, 4) !== dates[0].slice(0, 4);
  const dfmt = (d) => (long ? new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { month: "short", year: "numeric", timeZone: "UTC" }) : dayMonth(d));
  const legend = series.length < 2 ? "" : series.map((s, i) => `<button type="button" class="lg${s.real ? " real" : ""}" data-lg="${id}" data-i="${i}" aria-pressed="false"`
    + ` title="${esc(s.name)}"><i class="${s.dash ? "dash" : ""}" style="background:${s.color};color:${s.color}"></i><span>${esc(s.name)}</span></button>`).join("");
  CHARTS.push({ dates, f, x, y, dfmt, series: series.map((s) => ({ name: s.name, color: s.color, at: Object.fromEntries(s.points) })) });
  return `<div class="cwrap"><svg class="chart" data-chart="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}. Touch the chart to read values.">`
    + `${grid}${zero}${lines}<g class="cur"></g></svg><div class="tip" hidden></div></div>`
    + `<div class="axis" style="padding-left:${(L / W * 100).toFixed(1)}%;padding-right:${(R / W * 100).toFixed(1)}%"><span>${esc(dfmt(dates[0]))}</span><span>${esc(dfmt(dates[dates.length - 1]))}</span></div>`
    + (legend ? `<details class="lgd"><summary>Legend (${series.length})</summary><div class="legend" role="group" aria-label="Lines: tap one to highlight it">${legend}</div></details>` : "");
}

function cursor(e) {
  const svg = e.target.closest && e.target.closest("svg[data-chart]");
  if (!svg) return;
  const c = CHARTS[+svg.dataset.chart], box = svg.getBoundingClientRect();
  const px = ((e.touches ? e.touches[0].clientX : e.clientX) - box.left) / box.width * 340;
  let i = 0, best = Infinity;
  c.dates.forEach((d, k) => { const dx = Math.abs(c.x(d) - px); if (dx < best) { best = dx; i = k; } });
  const d = c.dates[i], cx = c.x(d);
  const hits = c.series.filter((s) => s.at[d] != null);
  svg.querySelector(".cur").innerHTML = `<line x1="${cx}" x2="${cx}" y1="0" y2="130" stroke="var(--muted)" stroke-dasharray="3 3"/>`
    + hits.map((s) => `<circle cx="${cx}" cy="${c.y(s.at[d]).toFixed(1)}" r="3.5" fill="${s.color}" stroke="var(--card)"/>`).join("");
  const tip = svg.parentNode.querySelector(".tip");
  tip.hidden = false;
  tip.innerHTML = `<b>${esc(dayMonth(d))}${d.slice(0, 4) !== String(new Date().getFullYear()) ? " " + d.slice(0, 4) : ""}</b>` + hits.slice(0, 9).map((s) => `<div><span style="color:${s.color}">●</span> ${esc(s.name)}: <b>${esc(c.f(s.at[d]))}</b></div>`).join("");
  const left = Math.min(Math.max(cx / 340 * box.width - tip.offsetWidth / 2, 0), box.width - tip.offsetWidth);
  tip.style.left = `${left}px`;
}
function cursorOff(e) {
  const svg = e.target.closest && e.target.closest("svg[data-chart]");
  if (!svg) return;
  svg.querySelector(".cur").innerHTML = "";
  svg.parentNode.querySelector(".tip").hidden = true;
}

// Range chips on every chart (24 Nov): 1D = yesterday and today, then 1W, 1M, 1Y, 5Y, All. Remembered per chart.
const RANGES = [["1D", null], ["1W", 7], ["1M", 30], ["1Y", 365], ["5Y", 1826], ["All", null]];
let RANGE = {};
try { RANGE = JSON.parse(localStorage.getItem("range") || "{}") || {}; } catch (e) {}
function daysBack(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); }
function clipTo(series, r) {
  const dates = [...new Set(series.flatMap((s) => s.points.map((p) => p[0])))].sort();
  const keep = r[0] === "1D" ? ((d) => dates.slice(-2).includes(d)) : r[0] === "All" ? (() => true) : ((d) => d >= daysBack(dates.at(-1), r[1]));
  return series.map((s) => ({ ...s, points: s.points.filter((p) => keep(p[0])) }));
}
const nDates = (series) => new Set(series.flatMap((s) => s.points.map((p) => p[0]))).size;
function ranged(key, series, defaultRange = "All") {
  // -> {series (clipped), chips (html), range}; chips with under two days of data are greyed out
  const ok = RANGES.map((r) => nDates(clipTo(series, r)) >= 2);
  let pick = RANGE[key] || defaultRange;
  if (!ok[RANGES.findIndex((r) => r[0] === pick)]) pick = "All";
  const chips = `<div class="rng" role="group" aria-label="Time range">${RANGES.map((r, i) => `<button type="button" data-rng="${key}" data-v="${r[0]}"`
    + ` aria-pressed="${r[0] === pick}"${ok[i] ? "" : " disabled"}>${r[0]}</button>`).join("")}</div>`;
  return { series: clipTo(series, RANGES.find((r) => r[0] === pick)), chips, range: pick };
}
function changeLine(s, range, kind) {
  // "1M: +2.3%" (values) or "1M: real +₹1,240" (P&L in rupees), from the first to the last point shown
  if (!s || s.points.length < 2) return "";
  const a = s.points[0][1], b = s.points.at(-1)[1];
  const label = range === "1D" ? `${dayMonth(s.points[0][0])} → ${dayMonth(s.points.at(-1)[0])}` : range;
  if (kind === "rs") return `<p class="chg"><b>${esc(label)}</b> · ${esc(s.name)} <span class="${cls(b - a)}">${rs(b - a, true)}</span></p>`;
  return `<p class="chg"><b>${esc(label)}</b> · ${esc(s.name)} <span class="${cls(b - a)}">${pct(a ? (b / a - 1) * 100 : null, true)}</span></p>`;
}

// Line colours per theme (distinct hues, >= 3:1 against the card in both themes).
const PAL_LIGHT = ["#2563eb", "#c2410c", "#7c3aed", "#15803d", "#b91c1c", "#0e7490", "#a16207", "#be185d", "#475569"];
const PAL_DARK = ["#60a5fa", "#fb923c", "#a78bfa", "#4ade80", "#f87171", "#22d3ee", "#facc15", "#f472b6", "#cbd5e1"];
const palette = () => (isDark() ? PAL_DARK : PAL_LIGHT);
function thin(points, max = 260) {   // keep long series light on a phone: every nth point, always the last
  if (points.length <= max) return points;
  const step = Math.ceil(points.length / max);
  return points.filter((_, i) => i % step === 0 || i === points.length - 1);
}
function plChart(rows, o) {
  // rows of {x, line, kind, y}; one line per `line`, filtered by the Real / Shadows / Both switch (o.key)
  const by = {};
  rows.filter((r) => num(r[o.y]) != null && keep(o.key, o.kindOf(r))).forEach((r) => {
    (by[r[o.line]] = by[r[o.line]] || { kind: o.kindOf(r), points: [] }).points.push([String(r[o.x]).slice(0, 10), num(r[o.y])]);
  });
  Object.values(by).forEach((v) => v.points.sort((a, b) => (a[0] < b[0] ? -1 : 1)));
  const rg = ranged(o.key + "_pl", Object.keys(by).map((n) => ({ name: n, points: by[n].points })));
  rg.series.forEach((sr) => { by[sr.name].points = sr.points; });
  Object.keys(by).forEach((n) => { if (!by[n].points.length) delete by[n]; });
  // the real line always, then the 5 best and the 2 worst by their latest value (so better-than-real shadows show)
  const last = (n) => by[n].points.at(-1)[1];
  const real = Object.keys(by).filter((n) => by[n].kind === "real");
  const rest = Object.keys(by).filter((n) => by[n].kind !== "real").sort((a, b) => last(b) - last(a));
  const best = rest.slice(0, 5), worst = rest.slice(5).slice(-2);
  const names = [...real, ...best, ...worst];
  const total = Object.keys(by).length;
  const series = names.map((n, i) => ({ name: by[n].kind === "real" ? "Real" : shortName(n, "Shadow"), real: by[n].kind === "real", color: by[n].kind === "real" ? "var(--fg)" : palette()[i % palette().length],
    dash: by[n].kind === "benchmark", points: by[n].points }));
  const css = getComputedStyle(document.documentElement);
  series.forEach((s) => { if (s.color === "var(--fg)") s.color = css.getPropertyValue("--fg").trim(); });
  const note = total > names.length ? `<p class="note">Real + 5 best + 2 worst of ${total}.</p>` : "";
  const head = rg.chips + changeLine(series.find((x) => x.real) || series[0], rg.range, "rs");
  return series.length ? head + lineChart(series, o.label, (v) => rs(v)) + note
    : '<p class="muted">No lines for this choice yet.</p>';
}

function story() {
  const k = one("desk_kpis"), st = dayState();
  const dec = rows("desk_decisions").filter((d) => d.trade_date === st.today);   // today's only (dayState)
  const today = k.day === st.today ? num(k.today_pnl_rs) : null, since = num(k.since_reset_pct);
  const placed = dec.filter((d) => String(d.decision).includes("Placed"));
  const skipped = dec.filter((d) => String(d.decision).startsWith("–"));
  const savedBy = skipped.filter((d) => String(d.result).includes("−")).length;
  const head = today != null ? (today > 0 ? "A green day" : today < 0 ? "A red day" : "A flat day")
    : st.closed ? "Markets closed today" : "Today's desk";
  const parts = [];
  parts.push(today != null ? `Today ${rs(today, true)}; ${pct(since, true)} overall.` : `${pct(since, true)} overall.`);
  if (!dec.length && !st.closed && today == null) parts.push("Today's trades appear after the close (evening update).");
  if (placed.length) parts.push(`${placed.length} trade${placed.length > 1 ? "s" : ""} placed: ${placed.map((d) => `${esc(d.symbol)} ${esc(d.result)}`).join(", ")}.`);
  if (skipped.length) parts.push(`${skipped.length} skipped${savedBy ? `, ${savedBy} of them would have lost` : ""}.`);
  const best = rows("intra_board").filter((r) => r.kind !== "Real" && num(r.vs_real_rs) != null).sort((a, b) => b.vs_real_rs - a.vs_real_rs)[0];
  if (best) parts.push(`Best shadow so far: ${esc(best.rule)} (${rs(best.vs_real_rs, true)} vs real).`);
  return `<section class="card story"><span class="when">${esc(new Date(st.today + "T00:00:00Z").toLocaleDateString("en-IN", { weekday: "short", timeZone: "UTC" }))} ${esc(dayMonth(st.today))}</span><h1>${head}</h1>${parts.map((p) => `<p>${p}</p>`).join("")}</section>`;
}

function desk() {
  const k = one("desk_kpis");

  const css = getComputedStyle(document.documentElement);

  return holidayCard() + story() + `
  <section class="card"><span class="muted" style="font-size:13px">Whole dummy portfolio</span><div class="big">${rs(k.portfolio_rs)}</div>
    <div class="${cls(k.since_reset_pct)}" style="font-weight:600">${pct(k.since_reset_pct, true)} overall</div>${chart}</section>
  <div class="tiles">

// Today-only rule (24 Nov): the Desk and Markets' India figures show only today's (IST) values, from the evening
// export until midnight; during market hours, on holidays and weekends they stay empty (a line says why).
function dayState() {
  const today = istToday(), m = rows("market_status")[0] || {};
  const wd = new Date(today + "T00:00:00Z").getUTCDay();
  const closed = (m.date === today && !!m.holiday) || wd === 0 || wd === 6;
  return { today, closed, why: closed ? "Market closed today." : "Today's figures appear after the close (evening update)." };
}
// Sensex close and move on one day (Yahoo series), or null.
function closeOn(name, day) {
  const r = rows(name), i = r.findIndex((x) => x.date === day);
  if (i < 1) return null;
  const a = num(r[i - 1].close), b = num(r[i].close);
  return { last: b, pct: a ? (b / a - 1) * 100 : null };
}
const dayMonth = (iso) => (iso ? `${Number(iso.slice(8, 10))} ${["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][Number(iso.slice(5, 7)) - 1]}` : "");
function indiaNow() {
  // Nifty 50, India VIX and breadth from NSE's files (lakehouse); Sensex from Yahoo, on the same day. Today's after
  // the evening update; otherwise (market hours, holidays, weekends) the last close, labelled (25 Nov change).
  const k = one("india_kpis"), d = dayState();
  if (!k.trade_date) return { pending: "Appears after the next update." };
  const stale = k.trade_date !== d.today;
  return {
    nifty: k.nifty_close != null ? { last: num(k.nifty_close), pct: num(k.nifty_pct) } : null,
    sensex: closeOn("sensex_5y", k.trade_date), vix: k.vix_close != null ? { last: num(k.vix_close), pct: num(k.vix_pct) } : null,
    adv: k.advances, dec: k.declines, date: k.trade_date,
    label: stale ? `last close, ${dayMonth(k.trade_date)}` : "today",

}
const lvl = (m, dp = 0) => (m && m.last != null ? m.last.toLocaleString("en-IN", { maximumFractionDigits: dp, minimumFractionDigits: dp }) : "–");
function glance() {
  const n = indiaNow(), sec = n.pending ? [] : rows("sector_board").filter((r) => r.kind === "industry" && num(r.change_pct) != null && r.trade_date === n.date);
  const best = sec[0], worst = sec.at(-1);

    + ` · worst ${esc(worst.sector)} <span class="${cls(worst.change_pct)}">${pct(worst.change_pct, true)}</span> · more on Markets</p>` : "";
  return `<section class="card"><h3>Market at a glance${n.label ? ` (${esc(n.label)})` : ""}</h3><div class="tiles three">`
    + tile("Nifty 50", lvl(n.nifty), n.nifty && n.nifty.pct, "", n.nifty && n.nifty.last)
    + tile("Sensex", lvl(n.sensex), n.sensex && n.sensex.pct, "", n.sensex && n.sensex.last)
    + tile("India VIX", lvl(n.vix, 1), n.vix && n.vix.pct, "", n.vix && n.vix.last, 2)

}

function eachPool() {
  const sw = viewSwitch("pools", ["Current (Invested)", "Returns (%)"]);
  const body = rows("desk_pools").map((r) => {
    const inv = num(r.value_rs) != null && num(r.pnl_rs) != null ? num(r.value_rs) - num(r.pnl_rs) : null;
    const right = sw.i === 0 ? two(rs(r.value_rs), `(${rs(inv)})`, cls(r.pnl_rs)) : two(rs(r.pnl_rs, true), `(${pct(r.return_pct, true)})`, cls(r.pnl_rs));
    return `<div class="row"><div class="n"><b>${esc(r.pool)}</b></div><div class="r">${right}</div></div>`;
  }).join("");
  return `<section class="card">${cardHead("Each pool", sw)}${body || '<p class="muted">No data yet.</p>'}</section>`;

function seg(key) {
  const opts = [["real", "Real"], ["shadow", "Shadows"], ["both", "Both"]];
  return `<div class="seg" role="group" aria-label="Show">${opts.map(([v, l]) => `<button type="button" data-seg="${key}" data-v="${v}" aria-pressed="${show[key] === v}">${l}</button>`).join("")}</div>`;
}
const keep = (key, kind) => show[key] === "both" || (show[key] === "real" ? /real|niftybees/i.test(kind) : !/^real$/i.test(kind));

function intraday() {
  const k = one("intraday_kpis");
  const rsw = viewSwitch("rules", ["Total", "vs real"]);
  const ruleRow = (r) => {
      const right = rsw.i === 0 ? two(rs(r.total_rs, true), `${esc(r.trades)} trades`, cls(r.total_rs))
        : r.vs_real_rs == null ? two("–", "the real result") : two(rs(r.vs_real_rs, true), "vs real", cls(r.vs_real_rs));
      return `<div class="row"><div class="n"><b>${esc(r.rule)}</b></div><div class="r">${right}</div></div>`;
  };
  const ib = rows("intra_board").filter((r) => keep("intraday", r.kind === "Real" ? "real" : "shadow"));
  const byVs = (a, b) => (num(b.vs_real_rs ?? b.total_rs) ?? -1e12) - (num(a.vs_real_rs ?? a.total_rs) ?? -1e12);
  const kinds = [...new Set(ib.filter((r) => r.kind !== "Real").map((r) => r.kind))];
  const board = ib.filter((r) => r.kind === "Real").map(ruleRow).join("") + kinds.map((kd) => {

      + (g.length > 5 ? `<button type="button" class="more" data-all="rules|${esc(kd)}">${all ? "Show fewer" : `Show all ${g.length}`}</button>` : "");
  }).join("");
  const ladder = rows("intra_bar_ladder").map((r) => `<div class="row"><div class="n"><b>${esc(r.version)}</b><span>${esc(r.trades)} trades · ${r.won_pct == null ? "–" : esc(r.won_pct) + "% won"}</span></div><div class="r ${cls(r.total_rs)}">${rs(r.total_rs, true)}</div></div>`).join("");

  </div>

  <section class="card"><h3>P&amp;L</h3>${plChart(rows("intra_lines"), { key: "intraday", x: "trade_date", y: "total_rs", line: "line",

// The trader's morning (paper-trader files), today only (dayState): the market part on Desk, the trader's own plan
// on Intraday. Information only.
function todaysMorning() {

}
const gapRow = (g) => `<div class="row"><div class="n"><b>${esc(g.symbol)}</b>${g.buy_sell == null ? "" : `<span>buy/sell ${esc(g.buy_sell)}x</span>`}</div><div class="r ${cls(g.gap_pct)}">${pct(g.gap_pct, true)}</div></div>`;
function marketMorning() {
  const m = todaysMorning();
  if (!m) return "";
  const p = m.plan || {}, r = m.read || {}, bits = [];
  const mood = [p.vix != null ? `India VIX ${Number(p.vix).toFixed(1)}` : "", p.bias ? `bias: ${esc(p.bias)}` : ""].filter(Boolean).join(" · ");
  const gaps = (m.gaps_up || []).length || (m.gaps_down || []).length
    ? `<div class="sub">Pre-open gaps (${esc(m.preopen_count)} stocks)</div><div class="tiles" style="gap:0 14px"><div>${(m.gaps_up || []).map(gapRow).join("") || '<p class="muted">None up</p>'}</div>`

  if (r.median_or_vs_day_range != null) bits.push(`opening range ${Math.round(r.median_or_vs_day_range * 100)}% of a usual day's`);
  if (r.india_vix_change_pct != null) bits.push(`India VIX ${pct(r.india_vix_change_pct, true)}`);

    : '<p class="note">The opening read appears after 09:25.</p>';
  return `<section class="card"><h3>Market this morning</h3>${mood ? `<p style="margin:0 0 4px;font-size:14px">${mood}</p>` : ""}${read}${gaps}`
    + `</section>`;
}
// The council test (paper, after the close): every proposal judged the same way by each method.
function councilCard() {
  const r = rows("council");
  if (!r.length) return "";

function autoBanner(key) {
  const on = (rows("pool_auto").find((r) => r.pool === (key === "swing" ? "swing" : "long_term")) || {}).on;
  const isOn = on == null ? key === "swing" : !!on;
  const cmd = key === "swing" ? "/swing" : "/longterm";
  const what = key === "swing" ? "momentum + news · review 1 Dec" : (isOn ? "quality picks" : "asks before each buy · go/no-go 18 Dec");
  return `<section class="card banner${isOn ? "" : " off"}"><h3>Auto ${isOn ? "ON" : "OFF"} · ${what}</h3><p class="muted" style="font-size:12px">${cmd} auto ${isOn ? "off" : "on"}</p></section>`;

function holdingsNow(name) {
  const sw = viewSwitch("holdings", ["Current (Invested)", "Returns (%)"]);
  const body = rows("holdings").filter((r) => r.pool === name).map((r) => {
    const inv = num(r.qty) != null && num(r.avg_cost) != null ? num(r.qty) * num(r.avg_cost) : null;
    const right = sw.i === 0 ? two(rs(r.value_rs), `(${rs(inv)})`, cls(r.pnl_rs)) : two(rs(r.pnl_rs, true), `(${pct(r.pnl_pct, true)})`, cls(r.pnl_rs));
    return `<div class="row"><div class="n"><b>${esc(r.symbol)}</b><span>${esc(r.qty)} @ ${esc(r.avg_cost)} · now ${esc(r.last_price)}${r.days_held == null ? "" : ` · day ${esc(r.days_held)}`}</span></div><div class="r">${right}</div></div>`;

function viewSwitch(id, labels) {
  const i = (VIEW[id] || 0) % labels.length;
  return { i, html: `<button type="button" class="vsw" data-view="${esc(id)}" data-n="${labels.length}" aria-label="Right column shows ${esc(labels[i])}; tap to change">‹ › <span>${esc(labels[i])}</span></button>` };
}
const cardHead = (title, sw) => `<div class="ch"><h3>${title}</h3>${sw ? sw.html : ""}</div>`;
const two = (top, sub, c) => `<span class="${c || ""}">${top}</span><br><span class="muted" style="font-weight:500;font-size:12px">${sub}</span>`;
// "Swing (real: momentum + news + your trades)" -> "Real: momentum + news + your trades"; "Swing shadow: news breakouts" -> "News breakouts"
function shortName(name, kind) {
  const n = String(name || "");
  if (/real/i.test(kind || "")) return n.replace(/^(Swing|Long-term|Intraday) \(real(: |, )?/, "Real: ").replace(/\)$/, "").replace(/^Real: $/, "Real");
  if (/niftybees/i.test(kind || "")) return "NIFTYBEES";
  const t = n.replace(/^(Swing|Long-term) shadow: /, "");
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const dShort = (iso) => (iso ? dayMonth(String(iso).slice(0, 10)) : "");
function shortReason(r) {
  const t = String(r || "");
  return t.replace(/^swing rules on hold: pool held in the index$/i, "parked in NIFTYBEES")
    .replace(/^to pay for your (\S+) buy$/i, "funds $1").replace(/^your own trade$/i, "your trade")
    .replace(/momentum rank (\d+)(\.0)?/i, "rank $1").replace(/^news breakout: /i, "news: ");
}

function pool(title, ds, key) {
  const k = one(ds + "_kpis");
  // Scoreboard: sorted by value now; NIFTYBEES = the real pool's money in NIFTYBEES on the same days.
  const ssw = viewSwitch("board", ["Current (Invested)", "Returns (%)", "vs NIFTYBEES"]);
  const sbRows = rows(ds + "_scoreboard").filter((r) => keep(key, r.kind));
  const realCap = (() => { const r = sbRows.find((x) => x.kind === "Real"); return r && num(r.value_rs) != null ? num(r.value_rs) - num(r.pnl_rs) : null; })();
  const sb = sbRows.map((r) => {
    if (r.kind !== "NIFTYBEES" || realCap == null) return { ...r, invested: num(r.value_rs) != null ? num(r.value_rs) - num(r.pnl_rs) : null };
    const v = realCap * (1 + num(r.return_pct) / 100);
    return { ...r, value_rs: v, pnl_rs: v - realCap, invested: realCap };
  }).sort((a, b) => (num(b.value_rs) ?? -1e12) - (num(a.value_rs) ?? -1e12));
  const bestShadow = sb.find((r) => r.kind === "Shadow");
  const board = sb.map((r) => {
    const right = ssw.i === 0 ? two(rs(r.value_rs), `(${rs(r.invested)})`, cls(r.pnl_rs))
      : ssw.i === 1 ? two(rs(r.pnl_rs, true), `(${pct(r.return_pct, true)})`, cls(r.pnl_rs))
      : r.kind === "NIFTYBEES" ? two("–", "benchmark") : two(esc(r.vs_niftybees), `NIFTYBEES ${pct(r.niftybees_pct, true)}`, arrowCls(r.vs_niftybees));
    return `<div class="row"><div class="n"><b>${r === bestShadow ? `<span class="up" aria-label="best shadow">${ICON.star}</span> ` : ""}${esc(shortName(r.strategy, r.kind))}</b>`
      + `<span>${r.kind === "NIFTYBEES" ? "benchmark" : esc(r.kind)} · since ${esc(dShort(r.since))}${r.trades == null ? "" : " · " + esc(r.trades) + " trades"}</span></div><div class="r">${right}</div></div>`;
  }).join("");
  // Trades grouped: the real pool first, then each shadow, newest first within each (10 per group)
  const tsw = viewSwitch("trades", ["Value", "P&L"]);
  const tradeRow = (r) => `<div class="row"><div class="n"><b>${esc(r.side)} ${esc(r.symbol)}</b><span>${esc(dShort(r.trade_date))} · ${esc(r.qty)} @ ${esc(r.price)}${r.reason ? " · " + esc(shortReason(r.reason)) : ""}</span></div>`
    + `<div class="r">${tsw.i === 0 ? `<span>${rs(r.value_rs)}</span>` : r.pnl_rs == null ? '<span class="muted">–</span>' : `<span class="${cls(r.pnl_rs)}">${rs(r.pnl_rs, true)}</span>`}</div></div>`;
  const groups = {};
  rows(ds + "_trades").filter((r) => keep(key, r.kind)).forEach((r) => { (groups[r.strategy] = groups[r.strategy] || []).push(r); });
  const order = Object.keys(groups).sort((a, b) => (groups[a][0].kind === "Real" ? -1 : groups[b][0].kind === "Real" ? 1 : a.localeCompare(b)));
  const trades = order.map((g) => {
    const real = groups[g][0].kind === "Real", n = groups[g].length;
    return `<div class="tgroup${real ? " real" : ""}"><div class="thead"><span class="tag ${real ? "tag-real" : "tag-shadow"}">${real ? "Real" : "Shadow"}</span>`
      + `<b>${esc(shortName(g, real ? "Real" : "Shadow").replace(/^Real: /, ""))}</b><span class="muted">${n} trade${n === 1 ? "" : "s"}</span></div>`
      + groups[g].slice(0, 10).map(tradeRow).join("") + "</div>";
  }).join("");
  return `<h2>${title}</h2>
  ${autoBanner(key)}
  <div class="tiles">
    <div class="tile"><span class="l">Real pool</span><span class="v">${rs(k.real_value_rs)}</span></div>
    <div class="tile"><span class="l">Real P&amp;L</span><span class="v ${cls(k.real_pnl_rs)}">${rs(k.real_pnl_rs, true)}</span></div>
    <div class="tile"><span class="l">Real return</span><span class="v ${cls(k.real_return_pct)}">${pct(k.real_return_pct, true)}</span></div>
    <div class="tile"><span class="l">Trades · real / shadows</span><span class="v">${esc(k.real_trades)} / ${esc(k.shadow_trades)}</span></div>
  </div>
  ${holdingsNow(key === "swing" ? "Swing" : "Long-term")}
  ${seg(key)}
  <section class="card"><h3>P&amp;L</h3>${plChart(rows(ds + "_returns"), { key, x: "snapshot_date", y: "pnl_rs", line: "strategy",
    kindOf: (r) => String(r.kind).toLowerCase(), label: title + " P&L, real and shadows" })}</section>
  ${suggested(ds)}
  <section class="card">${cardHead("Scoreboard", ssw)}${board || '<p class="muted">No data yet.</p>'}</section>
  <section class="card">${cardHead("Trades placed (last 30 days)", tsw)}${trades || '<p class="muted">No trades yet.</p>'}</section>
  <p class="note">${ICON.star} = best shadow</p>`;
}

const chartLink = (r) => (r.chart ? ` · <a href="${esc(r.chart)}" target="_blank" rel="noopener">chart ↗</a>` : "");
const SUG_LABEL = { "Momentum + news (auto rules)": "Momentum + news · exit: 2×ATR trailing or 20 days",

function testsFor(symbol) {
  const x = rows("longterm_tests").find((t) => t.symbol === symbol);
  if (!x) return "";
  const mk = (t) => {
    const v = String(t || "–"), pass = v.startsWith("✓"), fail = v.startsWith("✕");
    const text = v.replace(/^[✓✕–]\s*/, ""), word = pass ? "Passed: " : fail ? "Failed: " : "";
    return `<div class="tl ok ${pass ? "up" : fail ? "down" : "muted"}">${pass ? ICON.check : fail ? ICON.cross : ICON.dash}<span><span class="vh">${word}</span>${esc(text)}</span></div>`;
  };
  return `<div class="tests"><div class="sub">${esc(x.passed)} tests passed</div>${["capital", "debt", "cash", "growth", "price"].map((k) => mk(x[k])).join("")}</div>`;
}
function suggested(ds) {
  const r = rows(ds + "_suggest");
  const groups = [...new Set(r.map((x) => x.strategy))];
  const body = groups.map((g) => {
    const list = r.filter((x) => x.strategy === g), id = ds + "|" + g, all = SHOW_ALL.has(id), quality = /quality/i.test(g);
    return `<div class="sub">${esc(SUG_LABEL[g] || g)}</div>` + (all ? list : list.slice(0, 5)).map((x) => {
      const lv = x.stop == null ? "" : `stop ${esc(x.stop)}` + (x.target == null ? "" : ` · target ${esc(x.target)}`);
      const right = `${x.entry ? esc(x.entry) : "₹" + esc(x.close)}${lv ? `<br><span class="muted" style="font-weight:500;font-size:12px">${lv}</span>` : ""}`;
      if (quality) {
        const open = OPEN_PICK === x.symbol;
        return `<button type="button" class="row pick" data-pick="${esc(x.symbol)}" aria-expanded="${open}"><span class="n"><b>${esc(x.rank)}. ${esc(x.symbol)}</b><span>${esc(x.why)}</span></span><span class="r">${right}</span></button>`
          + (open ? testsFor(x.symbol) : "");
      }
      return `<div class="row"><div class="n"><b>${esc(x.rank)}. ${esc(x.symbol)}</b><span>${esc(x.why)}${chartLink(x)}</span></div><div class="r">${right}</div></div>`;
    }).join("") + (list.length > 5 ? `<button type="button" class="more" data-all="${esc(id)}">${all ? "Show fewer" : `Show all ${list.length}`}</button>` : "");
  }).join("");
  const asOf = r[0] && r[0].trade_date ? ` (${esc(dayMonth(String(r[0].trade_date).slice(0, 10)))})` : "";
  return `<section class="card sug"><h3>Suggested today${asOf}</h3>${body || '<p class="muted">Appears after the next export.</p>'}
    <p class="note">Information only. Not advice.</p></section>`;
}

function fuelMove(x) {   // change at the last price change, e.g. "−2.00 (−1.77%)" then "on 26 Nov"

  const d = now - was, sign = d > 0 ? "+" : d < 0 ? "−" : "";

}

  const k = one("markets_kpis"), n = indiaNow();
  const read = rows("market_read").map((r) => `<div class="row"><div class="n"><b>${esc(r.topic)}</b><span style="color:var(--fg);font-size:14px">${esc(r.what_the_data_says)}</span></div></div>`).join("");
  const ibja = rows("bullion_in"), b = (i) => ibja.find((r) => r.item === i);
  const g24 = b("Gold 24K (999)"), g22 = b("Gold 22K (916)"), sil = b("Silver (999)");
  const dm = dayMonth;
  const metalTile = (label, r) => tile(label, rupees(num(r.rate) * GST), num(r.change_pct), `${rupees(num(r.rate))} before GST`);
  const bullion = g24 ? `<div class="tiles three bul">${metalTile("24K gold", g24)}`
      + `${g22 ? metalTile("22K gold", g22) : ""}${sil ? metalTile("Silver", sil) : ""}</div>`
      + `<p class="note">Gold per 10 g, silver per kg · IBJA ${esc(dm(g24.as_of))} ${esc(g24.session)} · incl. 3% GST · making charges extra</p>`
    : '<p class="muted">Appears after the next update.</p>';
  const [label, get, fmt] = MKT_SERIES[MKT] || MKT_SERIES.nifty;
  const got = get(), metal = !Array.isArray(got);
  const pts = (metal ? got.pts : got).filter((p) => p[1] != null);
  let chart = '<p class="muted">Appears after the next export.</p>';
  if (pts.length >= 2) {
    const rg = ranged("mkt_" + MKT, [{ name: label, points: pts }], "1Y");
    const css = getComputedStyle(document.documentElement);
    chart = rg.chips + changeLine(rg.series[0], rg.range)
      + lineChart([{ name: label, color: css.getPropertyValue("--accent").trim(), points: thin(rg.series[0].points) }], label, fmt);
  }
  const switcher = `<div class="seg mkt" role="group" aria-label="Series">${Object.entries(MKT_SERIES).map(([key, v]) => `<button type="button" data-mkt="${key}" aria-pressed="${MKT === key}">${esc(v[0].split(" ")[0])}</button>`).join("")}</div>`;
  return `<h2>Markets</h2>
  <section class="card"><h3>India${n.label ? ` (${esc(n.label)})` : ""}</h3><div class="tiles">
    ${tile("Nifty 50", lvl(n.nifty), n.nifty && n.nifty.pct, "", n.nifty && n.nifty.last)}
    ${tile("Sensex", lvl(n.sensex), n.sensex && n.sensex.pct, "", n.sensex && n.sensex.last)}
    ${tile("India VIX", lvl(n.vix, 2), n.vix && n.vix.pct, "", n.vix && n.vix.last, 2)}
    ${tile("Breadth (all NSE)", `<span style="font-size:17px">${n.adv == null ? "–" : Number(n.adv).toLocaleString("en-IN")}↑ ${n.dec == null ? "–" : Number(n.dec).toLocaleString("en-IN")}↓</span>`)}
  </div>${n.pending ? `<p class="note">${esc(n.pending)}</p>` : ""}</section>
  ${fuel()}
  <section class="card"><h3>Gold &amp; silver</h3>${bullion}</section>
  ${sectors()}
  <section class="card"><h3>Today's read</h3>${read || '<p class="muted">No data yet.</p>'}</section>
  <section class="card"><h3>World</h3><div class="tiles four">
    ${tile("S&P 500", lvl({ last: num(k.sp500_level) }), k.sp500_pct, "", k.sp500_level)}
    ${tile("Nasdaq", lvl({ last: num(k.nasdaq_level) }), k.nasdaq_pct, "", k.nasdaq_level)}
    ${tile("Nikkei", lvl({ last: num(k.nikkei_level) }), k.nikkei_pct, "", k.nikkei_level)}
    ${tile("Brent", k.brent_usd == null ? "–" : "$" + esc(k.brent_usd), k.brent_pct, "", k.brent_usd, 1)}
  </div></section>
  <section class="card"><h3>Charts</h3>${switcher}${chart}<p class="note">${MKT === "gold" || MKT === "silver"
    ? (metal && got.scaled ? "Indian price incl. 3% GST: the world price × USD/INR each day, scaled so today matches today's IBJA rate (import duty and local premium), then GST. Making charges extra. "
       : "World price × USD/INR, before Indian duty and GST (the IBJA rate isn't in yet). ")
    : MKT === "acn" ? "Accenture, NYSE: ACN, in US dollars. " : ""}Daily closes from Yahoo Finance (weekly before the last five years).</p></section>`;
}

function series5y(name, label) {
  const r = rows(name);
  if (r.length < 2) return '<p class="muted">Appears after the next export.</p>';
  const rg = ranged(name, [{ name: label, points: r.map((x) => [x.date, num(x.close)]) }], "5Y");
  const pts = thin(rg.series[0].points);
  const last = num(r.at(-1).close), y1 = r.find((x) => x.date >= dateBack(r.at(-1).date, 1)), y5 = r.find((x) => x.date >= dateBack(r.at(-1).date, 5));
  const first = y5 && num(y5.close);
  const css = getComputedStyle(document.documentElement);
  const ch = (a) => (a ? ((last / a - 1) * 100) : null);
  return `<div class="tiles"><div class="tile"><span class="l">Latest (${esc(r.at(-1).date)})</span><span class="v">${last.toFixed(2)}</span></div>
    <div class="tile"><span class="l">1 year · 5 years</span><span class="v"><span class="${cls(ch(y1 && num(y1.close)))}">${pct(ch(y1 && num(y1.close)), true)}</span> · <span class="${cls(ch(first))}">${pct(ch(first), true)}</span></span></div></div>`
    + rg.chips + changeLine(rg.series[0], rg.range)
    + lineChart([{ name: label, color: css.getPropertyValue("--accent").trim(), points: pts }], label, (v) => v.toFixed(2));
}
// Latest close and its move vs the close before, from a Yahoo series ({date, close} rows).
function lastMove(name) {
  const r = rows(name);
  if (r.length < 2) return null;
  const a = num(r.at(-2).close), b = num(r.at(-1).close);
  return { date: r.at(-1).date, last: b, pct: a ? (b / a - 1) * 100 : null };
}
// Gold and silver come in USD per troy ounce; shown in rupees per 10 g / per kg with USD/INR on the same day
// (or the latest day before it). International price only: before Indian import duty and GST.
const OZ = 31.1035;
function inrSeries(name, grams) {
  const fx = rows("usdinr_5y").map((x) => [x.date, num(x.close)]).filter((x) => x[1]);
  const out = [];
  let j = 0, rate = null;
  rows(name).forEach((x) => {
    while (j < fx.length && fx[j][0] <= x.date) { rate = fx[j][1]; j += 1; }
    const v = num(x.close);
    if (rate && v) out.push([x.date, v * rate / OZ * grams]);
  });
  return out;
}
const rupees = (v) => (v == null ? "–" : "₹" + Math.round(v).toLocaleString("en-IN"));
// level: the current value; with it the move shows the change in points too, e.g. "+102 (+0.42%)"
const pts = (level, move, dp = 0) => {
  const d = level * move / (100 + move), a = Math.abs(d).toLocaleString("en-IN", { maximumFractionDigits: dp, minimumFractionDigits: dp });
  return (d > 0 ? "+" : d < 0 ? "−" : "") + a;
};
const tile = (label, value, move, extra, level, dp) => `<div class="tile"><span class="l">${esc(label)}</span><span class="v">${value}</span>`
  + (move == null ? "" : `<span class="s ${cls(move)}">${num(level) != null && num(move) != null ? pts(num(level), num(move), dp) + " (" + pct(move, true) + ")" : pct(move, true)}</span>`)
  + (extra ? `<span class="l">${extra}</span>` : "") + "</div>";
function dateBack(iso, years) { const d = new Date(iso); d.setFullYear(d.getFullYear() - years); return d.toISOString().slice(0, 10); }

function render() {
  CHARTS.length = 0;
  paintThemeButton();
  const st = one("desk_status");
  document.getElementById("chips").innerHTML = [st.auto_mode, st.india_vix, st.risk].filter((c) => c && c !== "–")
    .map((c) => `<span class="chip ${String(c).includes("ON") ? "on" : ""}">${esc(c)}</span>`).join("");
  document.getElementById("updated").textContent = D.updated_at ? `Updated ${dayMonth(String(D.updated_at).slice(0, 10))}, ${String(D.updated_at).slice(11, 16)} IST` + ((D.failed || []).length ? " · some parts older" : "") : "No data yet";
  const view = { desk, intraday, swing: () => pool("Swing", "swing", "swing"),
                 long: () => pool("Long term", "longterm", "long"), markets }[tab] || desk;
  document.getElementById("main").innerHTML = view() + '<p class="note">Dummy money only. Not investment advice.</p>';
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
}

document.getElementById("theme").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (err) {}
  paintThemeButton(); render();   // charts read their colours from the theme
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { paintThemeButton(); render(); });
document.querySelector("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
});
["pointerdown", "pointermove"].forEach((t) => document.getElementById("main").addEventListener(t, cursor));
["pointerleave", "pointercancel"].forEach((t) => document.getElementById("main").addEventListener(t, cursorOff, true));
document.getElementById("main").addEventListener("click", (e) => {
  const hh = e.target.closest("button[data-hide-holiday]");
  if (hh) {
    try { localStorage.setItem("holiday-hidden", hh.dataset.hideHoliday); } catch (err) {}
    hh.closest("section").remove(); return;
  }
  const mk = e.target.closest("button[data-mkt]");
  if (mk) { MKT = mk.dataset.mkt; try { localStorage.setItem("mkt", MKT); } catch (err) {} render(); return; }
  const ab = e.target.closest("button[data-all]");
  if (ab) { const id = ab.dataset.all; if (SHOW_ALL.has(id)) SHOW_ALL.delete(id); else SHOW_ALL.add(id); render(); return; }
  const vb = e.target.closest("button[data-view]");
  if (vb) { const id = vb.dataset.view; VIEW[id] = ((VIEW[id] || 0) + 1) % Number(vb.dataset.n); try { localStorage.setItem("views", JSON.stringify(VIEW)); } catch (err) {} render(); return; }
  const pk = e.target.closest("button[data-pick]");
  if (pk) { OPEN_PICK = OPEN_PICK === pk.dataset.pick ? "" : pk.dataset.pick; render(); return; }
  const sc = e.target.closest("button[data-sector]");
  if (sc) { OPEN_SECTOR = OPEN_SECTOR === sc.dataset.sector ? "" : sc.dataset.sector; render(); return; }
  const rb = e.target.closest("button[data-rng]");
  if (rb) {
    RANGE[rb.dataset.rng] = rb.dataset.v;
    try { localStorage.setItem("range", JSON.stringify(RANGE)); } catch (err) {}
    render(); return;
  }
  const lg = e.target.closest("button[data-lg]");
  if (lg) {   // tap a line's chip to highlight it; tap again to show all
    const svg = document.querySelector(`svg[data-chart="${lg.dataset.lg}"]`);
    const on = !(svg.classList.contains("hl") && svg.dataset.on === lg.dataset.i);
    svg.dataset.on = on ? lg.dataset.i : "";
    document.querySelectorAll(`button[data-lg="${lg.dataset.lg}"]`).forEach((x) => x.setAttribute("aria-pressed", String(on && x.dataset.i === lg.dataset.i)));
    svg.classList.toggle("hl", on);
    svg.querySelectorAll("polyline").forEach((p) => p.classList.toggle("on", on && p.dataset.i === lg.dataset.i));
    return;
  }
  const b = e.target.closest("button[data-seg]"); if (!b) return;
  show[b.dataset.seg] = b.dataset.v; render();
});

async function load() {
  try {
    const r = await fetch("data/desk.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
  } catch (err) {
    document.getElementById("main").innerHTML = '<section class="card err"><h3>Couldn\'t load the data</h3><p class="muted">It appears after the next export (about 09:10, 11:40, 16:15 or 20:30 IST). Pull down to retry.</p></section>';
    document.getElementById("updated").textContent = "Offline or not exported yet";
    return;
  }
  render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
